name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/setup-react-imports-11HA8, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: fifthkeys-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: fifthkeys-react

      - name: Build
        run: npm run build
        working-directory: fifthkeys-react

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fifthkeys-react/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
